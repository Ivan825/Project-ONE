[project]
name = "project-one"
version = "0.1.0"
description = "Recursive self-model feedback in evolving multi-agent networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["networkx>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
